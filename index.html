const magics=[['Свет',60,7000],['Тьма',60,3000],['Затмение',40,15000],['Галаграммы',10,60000],['Универсальная',1,777777777],['Призыв дракона',4,90000],['Вода',70,6000],['Огонь',80,5000],['Лёд',60,12000],['Земля',90,2000],['Молния',40,15000],['Порталы',30,5000],['Радиация',20,90000],['Безграничность',30,9000],['Природа',6,50000],['Поглощение стали',40,9000],['Стирание',1.5,90000000]];
const weapons=[['Проклятая двойная катана',5,50000],['Якорь акулы',40,9000],['Ледяное копьё',30,6000],['Голографическая коса',20,20000],['Голографическая панель',20,20000],['Светлая нагината',25,15000],['Берсерк',50,5000],['Сердце дракона',10,60000],['Огнестрел',60,900],['Нож',90,20],['Огненная катана',40,7000],['Радиоактивная базука',35,4000],['Молот',70,3000]];

{name:'Дэн',race:'Обычный ангел',magic:['Лёд'],weapon:['Ледяное копьё'],special:'Ничего'}];
const rand=p=>Math.random()*100<p;const pick=a=>a[Math.floor(Math.random()*a.length)];const shuffle=a=>[...a].sort(()=>Math.random()-.5);const fmt=n=>Number(n).toLocaleString('ru-RU',{maximumFractionDigits:2});
function weightedMagicCount(){if(rand(20))return 0;if(rand(10))return 3;if(rand(30))return 2;if(rand(50))return 1;return 0;}
function rollMagics(count){return shuffle(magics.filter(x=>rand(x[1])).map(x=>x[0])).slice(0,count);}
function rollWeapons(){if(rand(50))return [];return shuffle(weapons.filter(x=>rand(x[1]))).slice(0,2).map(x=>x[0]);}
function rollArtifacts(){if(rand(50))return [];if(rand(1))return ['Все камни'];const out=[];for(const x of artifacts){if(x[0]==='Все камни')continue;if(rand(x[1]))out.push(x[0]);}return shuffle(out).slice(0,3);}
function rollStyle(){const r=styles.filter(x=>rand(x[1])).map(x=>x[0]);return r.length?[pick(r)]:[];}
function rollSpecial(){const r=Math.random()*100;if(r<90)return 'Ничего';if(r<93.33)return 'Магический гибрид';if(r<96.66)return 'Шесть глаз';return 'Космическая сущность';}
function rollFirearm(){const a=[];if(rand(60))a.push('Пистолет');if(rand(50))a.push('Пулемёт');if(rand(40))a.push('Миниган');return a.length?pick(a):'';}
function matchesList(required,actual){if(required===undefined)return null;if(required.length===0)return actual.length===0;return required.some(v=>actual.includes(v));}
function matchCard(card,p){let hits=0,required=0;const details=[];function test(label,ok){required++;if(ok)hits++;details.push((ok?'✅ ':'❌ ')+label);}test('Раса: '+card.race,p.race===card.race);if(card.magic!==undefined)test('Магия: '+(card.magic.length?card.magic.join(' / '):'Ничего'),matchesList(card.magic,p.magic));if(card.weapon!==undefined){const wm=matchesList(card.weapon,p.allWeapons);const ok=card.effect?wm&&p.effect===card.effect:wm;test('Оружие: '+(card.weapon.length?card.weapon.join(' / '):'Ничего')+(card.effect?' | действие: '+card.effect:''),ok);}if(card.style!==undefined)test('Боевой стиль: '+(card.style.length?card.style.join(' / '):'Ничего'),matchesList(card.style,p.style));if(card.special!==undefined)test('Особая техника: '+card.special,card.special===p.special);return {card,hits,required,details,full:hits===required};}
function generate(){
 const race=pick(races),magic=rollMagics(weightedMagicCount()),weapon=rollWeapons(),firearm=weapon.includes('Огнестрел')?rollFirearm():'';
 const effect=weapon.includes('Проклятая двойная катана')?pick(['Антирегенерация','Восстановление здоровья','Усиление']):'';
 const ownership=Math.floor(Math.random()*100)+1,art=rollArtifacts(),style=rollStyle(),special=rollSpecial();
 const allWeapons=[...weapon];if(firearm)allWeapons.push(firearm);
 const person={race:race[0],magic,weapon,firearm,effect,ownership,art,style,special,allWeapons};
 const raceScore=race[1],magicScore=magic.reduce((s,n)=>s+(magics.find(x=>x[0]===n)?.[2]||0),0);
 let weaponScore=0;const weaponLines=[];for(const n of weapon){const base=weapons.find(x=>x[0]===n)?.[2]||0,adjusted=base*(1+.003*ownership);weaponScore+=adjusted;weaponLines.push({name:n,base,adjusted});}
 const hologramPair=weapon.includes('Голографическая коса')&&weapon.includes('Голографическая панель');if(hologramPair)weaponScore*=2;
 const artScore=art.reduce((s,n)=>s+(artifacts.find(x=>x[0]===n)?.[2]0),0),styleScore=style.length?(styles.find(x=>x[0]===style[0])?.[2]0):100;
 const specialScore=special==='Магический гибрид'?(race[0].startsWith('Гибрид')?30000:0):(specialTech.find(x=>x[0]===special)?.[2]||0);

 const results=cards.map(c=>matchCard(c,person)),twoMatchCards=results.filter(r=>r.hits===2).length,bestHits=Math.max(0,...results.map(r=>r.hits)),hasFull=results.some(r=>r.full);
 const cardBoost=hasFull?10:bestHits>=4?5:bestHits>=3?3:1,groupBoost=twoMatchCards>=2?1.5:1,total=base*cardBoost*groupBoost;
 const out=document.getElementById('output');out.innerHTML=<section class="panel"><h2>👤 ${name}</h2>
 <div class="line">Раса: <b>${person.race}</b> <span class="score">+${fmt(raceScore)}</span></div><div class="line">Магия: ${magic.join(', ')||'Ничего'} <span class="score">+${fmt(magicScore)}</span></div><div class="line"><b>Оружие:</b></div>
 ${weaponLines.length?weaponLines.map(i=><div class="line">${i.name}: ${fmt(i.base)} × коэффициент владения = <span class="score">${fmt(i.adjusted)}</span></div>).join(''):'<div class="line">Ничего</div>'}
 ${firearm?<div class="line">Подтип огнестрела: ${firearm}</div>:''}${hologramPair?'<div class="line">Бонус пары голограмм к очкам оружия: ×2</div>':''}${effect?<div class="line">Действие катаны: ${effect}</div>:''}
 <div class="line">Артефакты: ${art.join(', ')||'Ничего'} <span class="score">+${fmt(artScore)}</span></div><div class="line">Боевой стиль: ${style[0]||'Ничего'} <span class="score">+${fmt(styleScore)}</span></div><div class="line">Особая техника: ${special} <span class="score">+${fmt(specialScore)}</span></div><hr><div class="muted">Очки до бустеров</div><div class="total">${fmt(base)}</div><div class="line">Бустер за совпадения: ×${cardBoost}</div><div class="line">Общий бустер за две и более карточки с 2 совпадениями: ×${groupBoost}</div><div class="total">ИТОГО: ${fmt(total)}</div></section><h2>⭐ Особые карточки</h2>
 ${results.map(r=>{const {card,hits,required,details,full}=r,cls=full?'purple':hits>=3?'red':hits===2?'yellow':'',label=full?'ПОЛНОЕ СОВПАДЕНИЕ':hits>=3?${hits} совпадения:hits===2?'2 совпадения':'';return <section class="card ${cls}"><b>${card.name}</b> — ${hits}/${required}<div class="muted">${label}</div><details><summary>Показать совпадения и недостающее</summary>${details.map(d=><div class="line">${d}</div>).join('')}</details></section>}).join('')};
}
